<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ogBg" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="auroraLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle ambient aurora orbs -->
  <circle cx="200" cy="150" r="280" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="320" fill="#f43f5e" opacity="0.10" filter="url(#glow)"/>
  <circle cx="950" cy="180" r="240" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Left Header Badge -->
  <g transform="translate(80, 80)">
    <rect width="320" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="url(#auroraLine)" stroke-width="1.5"/>
    <text x="24" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#38bdf8" letter-spacing="2">
      🎧 IL MIO RIFUGIO MUSICALE
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 180)">
    <text x="0" y="55" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="1">
      SANCTUARY
    </text>
    <text x="0" y="115" font-family="'Cinzel', Georgia, serif" font-weight="700" font-size="34" fill="url(#goldText)" letter-spacing="2">
      LE CANZONI CHE DEFINISCONO UN'ANIMA
    </text>

    <!-- Subtitle description -->
    <text x="0" y="175" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="21" fill="#cbd5e1">
      Dal raccoglimento intimo di Lana Del Rey &amp; Jeff Buckley alla carica di Rocky Balboa,
    </text>
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="21" fill="#cbd5e1">
      la catarsi rock dei Linkin Park e la poesia senza tempo di Cesare Cremonini.
    </text>

    <!-- Genre Tags Bar -->
    <g transform="translate(0, 270)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="170" height="42" rx="21" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8"/>
      <text x="85" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#38bdf8" text-anchor="middle">🌙 Rifugio &amp; Relax</text>

      <!-- Tag 2 -->
      <rect x="185" y="0" width="200" height="42" rx="21" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444"/>
      <text x="285" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ef4444" text-anchor="middle">🥊 Rocky Balboa</text>

      <!-- Tag 3 -->
      <rect x="400" y="0" width="180" height="42" rx="21" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7"/>
      <text x="490" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#a855f7" text-anchor="middle">⚡ Rock &amp; Catarsi</text>

      <!-- Tag 4 -->
      <rect x="595" y="0" width="210" height="42" rx="21" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b"/>
      <text x="700" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#f59e0b" text-anchor="middle">🇮🇹 Cesare Cremonini</text>
    </g>
  </g>

  <!-- Right Visual: Stylized Glowing Vinyl Disc & Equalizer -->
  <g transform="translate(930, 315)">
    <!-- Vinyl Disc -->
    <circle cx="0" cy="0" r="160" fill="#090d16" stroke="url(#auroraLine)" stroke-width="5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="125" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="50" fill="#1e1b4b" stroke="url(#goldText)" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff"/>
  </g>

  <!-- Footer Info -->
  <g transform="translate(80, 545)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b">
      41 Brani Iconici Selezionati • YouTube Player HD • Sleep Timer &amp; PWA Ready • Curato da @Lukecele
    </text>
  </g>
</svg>
